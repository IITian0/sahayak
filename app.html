<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sahayak — App</title>
<style>
:root{
  --plum:#2E1A3E;--plum2:#3F2652;--plum3:#513068;
  --coral:#E2603C;--coral2:#B8462A;
  --lav:#B39AC7;--lav2:#D6C6E2;
  --cream:#FBF6F1;--ink:#241A2B;--ink2:#6A5C74;--ink3:#9A8CA4;
  --mint:#E4D8EC;--peach:#F6D9CE;--line:#EBE1F1;--white:#fff;
  --green:#2F7D5B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  background:radial-gradient(circle at 72% 18%,#43295A 0%,#2E1A3E 42%,#120A19 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;color:#fff}
.cap{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#C9B6D8;margin-bottom:14px;font-weight:600}
.cap b{color:#E2603C}
.phone{width:392px;max-width:100%;height:792px;background:#0E0816;border-radius:52px;padding:10px;
  box-shadow:0 50px 110px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.07) inset;position:relative}
.screen{width:100%;height:100%;background:var(--cream);border-radius:44px;overflow:hidden;
  display:flex;flex-direction:column;color:var(--ink);position:relative}
.notch{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:118px;height:26px;background:#0E0816;border-radius:14px;z-index:20}
.sbar{flex:none;height:46px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font-size:12px;font-weight:700;color:var(--ink)}
.sbar .r{display:flex;gap:5px;align-items:center}
.sbar i{display:block;background:var(--ink);border-radius:2px}
.sig{width:15px;height:9px;clip-path:polygon(0 100%,20% 100%,20% 60%,40% 60%,40% 30%,60% 30%,60% 10%,80% 10%,80% 0,100% 0,100% 100%)}
.wifi{width:13px;height:9px;clip-path:polygon(50% 0,100% 55%,85% 70%,50% 35%,15% 70%,0 55%)}
.bat{width:20px;height:10px;border-radius:3px}
.view{flex:1;overflow-y:auto;position:relative}
.view::-webkit-scrollbar{width:0}
.pad{padding:0 18px 16px}
.hd{display:flex;align-items:center;gap:12px;padding:6px 18px 12px}
.hd h1{font-size:20px;margin:0;letter-spacing:-.01em}
.hd p{margin:2px 0 0;font-size:11.5px;color:var(--ink2)}
.mark{width:36px;height:36px;border-radius:11px;background:var(--plum);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;flex:none}
.mark span{display:block;width:17px;height:10px;border:3px solid var(--cream);border-top:none;border-radius:0 0 18px 18px;position:relative}
.mark span::after{content:"";position:absolute;top:-12px;left:50%;transform:translateX(-50%) rotate(45deg);width:8px;height:8px;background:var(--coral);border-radius:50%}
.avatar{margin-left:auto;width:34px;height:34px;border-radius:50%;background:var(--peach);color:var(--coral2);display:grid;place-items:center;font-size:12px;font-weight:800}
.k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--coral);font-weight:800;margin:16px 0 8px}
.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:12px}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:13px;color:#fff;transition:.15s}
.chk.on{background:var(--lav);border-color:var(--lav)}
.t{font-size:14px;font-weight:700}
.s{font-size:11.5px;color:var(--ink2);margin-top:2px}
.done{text-decoration:line-through;color:var(--ink3)}
.prog{background:var(--plum);border-radius:18px;padding:16px;color:#fff;display:flex;align-items:center;gap:16px;margin-bottom:6px}
.ring{width:60px;height:60px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:800;background:conic-gradient(var(--coral) var(--p,0%),rgba(255,255,255,.16) 0)}
.ring i{width:46px;height:46px;border-radius:50%;background:var(--plum);display:grid;place-items:center;font-style:normal}
.btn{display:block;width:100%;border:none;background:var(--coral);color:#fff;font-size:14px;font-weight:800;padding:14px;border-radius:15px;cursor:pointer;font-family:inherit;transition:.15s}
.btn:active{transform:scale(.985)}
.btn.ghost{background:#fff;color:var(--plum);border:1px solid var(--line)}
.btn.plum{background:var(--plum)}
.msg{display:flex;gap:10px;margin-bottom:12px}
.av{width:34px;height:34px;border-radius:50%;background:var(--mint);color:var(--plum);font-size:12px;font-weight:800;display:grid;place-items:center;flex:none}
.bub{background:#fff;border:1px solid var(--line);border-radius:5px 15px 15px 15px;padding:10px 12px;font-size:12.5px;line-height:1.5}
.bub b{display:block;font-size:11px;color:var(--coral);margin-bottom:2px}
.bub .meta{font-size:10px;color:var(--ink3);margin-top:6px;display:flex;gap:12px}
.bub .meta span{cursor:pointer}
.composer{display:flex;gap:8px;margin-top:4px}
.composer input{flex:1;border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px;font-size:13px;font-family:inherit;color:var(--ink)}
.composer input:focus{outline:2px solid var(--lav2)}
.composer button{border:none;background:var(--plum);color:#fff;border-radius:13px;padding:0 16px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit}
.helper{display:flex;align-items:center;gap:12px}
.helper .av{width:42px;height:42px;background:var(--peach);color:var(--coral2);font-size:14px}
.n{font-size:14px;font-weight:800}
.m{font-size:11.5px;color:var(--ink2)}
.book{margin-left:auto;background:var(--plum);color:#fff;border:none;border-radius:11px;padding:9px 15px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}
.book:disabled{background:var(--lav)}
.ok{background:var(--mint);border:1px solid var(--lav2);border-radius:14px;padding:12px;font-size:12.5px;color:var(--plum);margin-top:10px}
.stat{display:flex;gap:10px;margin:8px 0 12px}
.stat div{flex:1;background:var(--plum3);border-radius:14px;padding:12px;text-align:center;color:#fff}
.stat b{display:block;font-size:20px}
.stat small{font-size:10px;color:var(--lav2)}
nav{flex:none;display:flex;background:#fff;border-top:1px solid var(--line);padding:8px 4px 16px}
nav button{flex:1;background:none;border:none;font-family:inherit;font-size:9.5px;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:4px 0}
nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--coral);font-weight:800}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}
.tabs::-webkit-scrollbar{height:0}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:12px;font-weight:700;color:var(--ink2);cursor:pointer;font-family:inherit}
.chip.on{background:var(--plum);color:#fff;border-color:var(--plum)}
.slot{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;text-align:center;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink)}
.slot.on{background:var(--plum);color:#fff;border-color:var(--plum)}
.hero-onb{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 30px}
.hero-onb .big{width:88px;height:88px;border-radius:26px;background:var(--plum);display:flex;align-items:flex-end;justify-content:center;padding-bottom:18px;margin-bottom:22px}
.hero-onb .big span{display:block;width:42px;height:24px;border:7px solid var(--cream);border-top:none;border-radius:0 0 44px 44px;position:relative}
.hero-onb .big span::after{content:"";position:absolute;top:-28px;left:50%;transform:translateX(-50%) rotate(45deg);width:18px;height:18px;background:var(--coral);border-radius:50%}
.hero-onb h2{font-size:26px;margin:0 0 10px;letter-spacing:-.02em}
.hero-onb p{font-size:13.5px;line-height:1.6;color:var(--ink2);margin:0 0 26px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:14px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--coral);width:18px;border-radius:4px}
.switch{display:flex;background:var(--mint);border-radius:12px;padding:3px;gap:3px}
.switch button{flex:1;border:none;background:none;padding:8px;border-radius:9px;font-size:12px;font-weight:800;color:var(--plum);cursor:pointer;font-family:inherit}
.switch button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.listrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.listrow:last-child{border-bottom:none}
.listrow .ic{width:30px;height:30px;border-radius:9px;background:var(--mint);display:grid;place-items:center;flex:none;font-size:14px}
.hint{margin-top:14px;font-size:11.5px;color:#B39AC7;text-align:center}
</style>

<script>
(function () {
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('keydown', function (e) {
    var k = (e.key || '').toLowerCase();
    var devtools = (e.key === 'F12') ||
      (e.ctrlKey && e.shiftKey && (k === 'i' || k === 'j' || k === 'c')) ||
      (e.metaKey && e.altKey && (k === 'i' || k === 'j' || k === 'c')) ||
      (e.ctrlKey && (k === 'u' || k === 's'));
    if (devtools) { e.preventDefault(); return false; }
  });
  document.addEventListener('dragstart', function (e) { e.preventDefault(); });
})();

<body>
<div class="cap">Sahayak · <b>working app</b></div>
<div class="phone">
  <div class="notch"></div>
  <div class="screen">
    <div class="sbar"><span id="clock">9:41</span><span class="r"><i class="sig"></i><i class="wifi"></i><i class="bat"></i></span></div>
    <div class="view" id="view"></div>
    <nav id="nav"></nav>
  </div>
</div>
<div class="hint">Data saves on this device · refresh and it stays</div>
<div id="toast" style="position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#2E1A3E;color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:99;box-shadow:0 12px 30px rgba(0,0,0,.35)"></div>

<style>
.field{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;font-size:14px;font-family:inherit;color:var(--ink);margin-bottom:10px}
.field:focus{outline:2px solid var(--lav2)}
.addrow{display:flex;gap:8px;margin:4px 0 10px}
.addrow input{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 13px;font-size:13px;font-family:inherit;color:var(--ink)}
.addrow button{border:none;background:var(--lav);color:var(--plum);border-radius:12px;padding:0 16px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit}
.daychips{display:flex;gap:8px;margin:0 0 10px}
.daychips button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-size:12px;font-weight:700;color:var(--ink2);cursor:pointer;font-family:inherit}
.daychips button.on{background:var(--plum);color:#fff;border-color:var(--plum)}
.bk{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.bk:last-child{border-bottom:none}
.bk b{font-size:12.5px}
.bk small{color:var(--ink3);display:block;font-size:11px}
.lbl{font-size:11px;font-weight:800;color:var(--ink2);margin:2px 0 6px}
</style>

<script>
var KEY = 'sahayak_v1';

var DEFAULT = {
  v: 1, name: '', elder: 'Savitri Devi', lang: 'en',
  tasks: [
    {id:'t1', t:{en:"Morning medicine",hi:"Subah ki dawa"}, d:{en:"Donepezil 5 mg · 8:00 am",hi:"Donepezil 5 mg · 8:00 baje"}, done:true},
    {id:'t2', t:{en:"Breakfast and water",hi:"Nashta aur paani"}, d:{en:"Soft food, 2 glasses · 9:00 am",hi:"Naram khana, 2 glass · 9:00 baje"}, done:true},
    {id:'t3', t:{en:"Afternoon walk",hi:"Dopahar ki sair"}, d:{en:"With support, 15 min · 4:30 pm",hi:"Sahara ke saath, 15 min · 4:30 baje"}, done:false}
  ],
  posts: [
    {n:"Sunita · Jaipur", m:{en:"Amma refused food today. Is that normal?",hi:"Amma ne aaj khana nahi khaya. Kya ye normal hai?"}, likes:4, ago:"12m"},
    {n:"Dr. Rao · clinical", m:{en:"It can happen. Offer small meals through the day, and log it in Care plan.",hi:"Ho sakta hai. Din bhar thoda-thoda khilayein, aur Care plan me likhein."}, likes:11, ago:"8m"},
    {n:"Meera · Ajmer", m:{en:"Same with my father. Warm milk before the meal helped us.",hi:"Mere papa ke saath bhi aisa tha. Khane se pehle garam doodh se fayda hua."}, likes:7, ago:"3m"}
  ],
  bookings: [], sentAt: null, liked: {}, slot: 2, day: 0, fall: null, sos: null
};

var S = null;
function load() {
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { var o = JSON.parse(raw); S = Object.assign({}, DEFAULT, o); return; }
  } catch (e) {}
  S = JSON.parse(JSON.stringify(DEFAULT));
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

var L = {
  en:{today:"Today",plan:"Care plan",circle:"Circle",help:"Respite",family:"Family",safety:"Safety",
      hi:"Good morning", sub:"care · Jaipur", k1:"Today's care", k2:"Caregiver tip",
      tip:"Keep the evening calm — dim the lights by 8 pm and play the same soft music. Familiar routines reduce agitation.",
      book:"Book a helper for a few hours", note:"Family note sent", noteSub:"sent",
      steps:"care steps", add:"Add a care step"},
  hi:{today:"Aaj",plan:"Care plan",circle:"Circle",help:"Madad",family:"Parivaar",safety:"Suraksha",
      hi:"Suprabhat", sub:"ki dekhbhal · Jaipur", k1:"Aaj ki dekhbhal", k2:"Caregiver tip",
      tip:"Shaam shaant rakhein — 8 baje tak roshni kam karein aur wahi halka sangeet bajayein.",
      book:"Kuch ghanton ke liye helper book karein", note:"Parivaar ko note bheja", noteSub:"bheja",
      steps:"care steps", add:"Nayi care step jodein"}
};
function t(k){ return L[S.lang][k]; }
var SLOTS = ["9–12","12–3","3–6","6–9"];
var DAYS = ["Today","Tomorrow"];
var HELPER_NAMES = ["Meena Sharma","Kavita Rao","Anita Verma"];

function pct(){ var d=S.tasks.filter(function(x){return x.done}).length; return S.tasks.length? Math.round(d/S.tasks.length*100):0; }
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}); }

var toastTimer=null;
function toast(msg){
  var x=el('toast'); x.textContent=msg; x.style.opacity='1'; x.style.transform='translate(-50%,0)';
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ x.style.opacity='0'; x.style.transform='translate(-50%,20px)'; },1900);
}

function navHTML(){
  var tabs=[["home","today","M3 10.5 12 3l9 7.5V21H3z"],["plan","plan","M4 6h16M4 12h16M4 18h10"],
            ["circle","circle","M21 12a8 8 0 0 1-11.6 7.1L4 21l1.9-5.4A8 8 0 1 1 21 12Z"],
            ["help","help","M12 21s-7-4.6-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.4-7 10-7 10Z"],
            ["family","family","M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 7a4 4 0 1 0 0 8 4 4 0 0 0 0-8M22 20v-2a4 4 0 0 0-3-3.9"],["safety","safety","M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"]];
  return tabs.map(function(x){ var k=x[0],l=x[1],d=x[2];
    return '<button class="'+(S.tab===k?'on':'')+'" onclick="go(\''+k+'\')"><svg viewBox="0 0 24 24"><path d="'+d+'"/></svg>'+t(l)+'</button>';
  }).join('');
}

function head(){
  return '<div class="hd"><div class="mark"><span></span></div><div><h1>Sahayak</h1><p>'+esc(S.elder)+' '+t('sub')+'</p></div><div class="avatar" onclick="go(\'profile\')">'+esc((S.name||'A').charAt(0).toUpperCase())+'</div></div>';
}

/* ---------- onboarding ---------- */
function onboarding(){
  el('nav').style.display='none';
  el('view').innerHTML = '<div class="hero-onb">'
    + '<div class="big"><span></span></div>'
    + '<h2>Care, held together</h2>'
    + '<p>Sahayak guides the person who looks after an elder at home. Set it up in ten seconds.</p>'
    + '<div style="width:100%;max-width:300px;text-align:left">'
    + '<div class="lbl">Your name</div><input class="field" id="f1" placeholder="Asha Sharma">'
    + '<div class="lbl">Who are you caring for?</div><input class="field" id="f2" placeholder="Savitri Devi">'
    + '<button class="btn" onclick="startApp()">Get started</button>'
    + '</div></div>';
}

/* ---------- screens ---------- */
function home(){
  var done=S.tasks.filter(function(x){return x.done}).length;
  return head()+'<div class="pad">'
    + '<div class="prog"><div class="ring" style="--p:'+pct()+'%"><i>'+pct()+'%</i></div>'
    + '<div><div style="font-size:15px;font-weight:800">'+t('hi')+', '+esc(S.name||'Asha')+'</div>'
    + '<div style="font-size:11.5px;color:#D6C6E2;margin-top:3px">'+done+' / '+S.tasks.length+' '+t('steps')+' done</div></div></div>'
    + '<div class="k">'+t('k1')+'</div>'
    + S.tasks.map(function(x,i){ return '<div class="card"><div class="row">'
        + '<div class="chk '+(x.done?'on':'')+'" onclick="toggle('+i+')">'+(x.done?'✓':'')+'</div>'
        + '<div style="flex:1;min-width:0"><div class="t '+(x.done?'done':'')+'">'+esc(x.t[S.lang])+'</div><div class="s">'+esc(x.d[S.lang])+'</div></div>'
        + '<div style="font-size:16px;color:#C0AECB;cursor:pointer;padding:0 4px" onclick="del('+i+')">×</div>'
        + '</div></div>'; }).join('')
    + '<div class="addrow"><input id="nt" placeholder="'+t('add')+'" onkeydown="if(event.key===\'Enter\')addTask()"><button onclick="mic()" title="Speak with your voice" style="display:grid;place-items:center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#2E1A3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10a7 7 0 0 1-14 0"/><path d="M12 17v4"/></svg></button><button onclick="addTask()">Add</button></div>'
    + '<div class="row" style="gap:8px;margin:2px 0 10px">'
    + '<button class="btn ghost" style="flex:1;padding:11px;font-size:12.5px" onclick="speak()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:7px;vertical-align:-2px"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>Listen</button>'
    + '<button class="btn ghost" style="flex:1;padding:11px;font-size:12.5px" onclick="remind()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:7px;vertical-align:-2px"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>Remind</button>'
    + '</div>'
    + '<div class="card"><div class="k" style="margin-top:0">'+t('k2')+'</div>'
    + '<div style="font-size:12.5px;line-height:1.55;color:var(--ink2)">'+t('tip')+'</div></div>'
    + '<button class="btn" onclick="go(\'help\')">'+t('book')+'</button>'
    + '<div class="card" style="margin-top:12px"><div class="row"><div class="chk on">✓</div>'
    + '<div><div class="t done">'+t('note')+'</div><div class="s">'+t('noteSub')+' '+(S.sentAt||'9:12 am')+'</div></div></div></div>'
    + '</div>';
}

function plan(){
  var meds=[["Donepezil","5 mg","8:00 am","After breakfast"],["Memantine","10 mg","2:00 pm","After lunch"],
            ["Vitamin D","1 tab","9:00 am","Weekly, Monday"],["BP check","—","6:00 pm","Log the reading"]];
  return head()+'<div class="pad"><div class="k">'+(S.lang==='en'?'Medicines today':'Aaj ki dawaiyan')+'</div>'
    + meds.map(function(m){ return '<div class="card"><div class="row">'
      + '<div style="width:34px;height:34px;border-radius:10px;background:var(--mint);display:grid;place-items:center;font-size:15px">💊</div>'
      + '<div><div class="t">'+m[0]+' <span style="font-weight:600;color:var(--ink2)">'+m[1]+'</span></div><div class="s">'+m[3]+'</div></div>'
      + '<div style="margin-left:auto;font-size:12px;font-weight:800;color:var(--coral)">'+m[2]+'</div></div></div>'; }).join('')
    + '<div class="card" style="background:var(--peach);border-color:#EFC9B9">'
    + '<div style="font-size:12px;font-weight:800;color:var(--coral2);margin-bottom:4px">Doctor\'s note · Dr. Rao</div>'
    + '<div style="font-size:12.5px;line-height:1.55;color:#7A3B25">Keep the afternoon quiet. If she refuses food twice in a day, message the circle.</div></div>'
    + '<button class="btn ghost" onclick="go(\'circle\')">Ask the circle a question</button></div>';
}

function circle(){
  return head()+'<div class="pad"><div class="k">Caregiver circle · Jaipur</div>'
    + S.posts.map(function(p,i){ return '<div class="msg"><div class="av">'+esc(p.n.charAt(0))+'</div>'
      + '<div class="bub"><b>'+esc(p.n)+'</b>'+esc(p.m[S.lang])
      + '<div class="meta"><span onclick="like('+i+')">♥ '+(p.likes+(S.liked[i]?1:0))+'</span><span>Reply</span><span>'+p.ago+'</span></div>'
      + '</div></div>'; }).join('')
    + '<div class="composer"><input id="q" placeholder="'+(S.lang==='en'?'Ask the circle…':'Circle se poochhein…')+'" onkeydown="if(event.key===\'Enter\')send()"><button onclick="send()">Send</button></div>'
    + '</div>';
}

function help(){
  var hs=[{n:"Meena Sharma",m:"Verified · 4 years · Hindi",r:"4.9"},{n:"Kavita Rao",m:"Dementia care trained",r:"4.8"},
          {n:"Anita Verma",m:"Verified · 2 years · Marathi",r:"4.7"}];
  return head()+'<div class="pad"><div class="k">'+(S.lang==='en'?'Verified helpers near you':'Aapke paas ke verified helpers')+'</div>'
    + hs.map(function(h,i){ return '<div class="card"><div class="helper"><div class="av">'+h.n.charAt(0)+'</div>'
      + '<div><div class="n">'+h.n+'</div><div class="m">'+h.m+' · ★ '+h.r+'</div></div>'
      + '<button class="book" onclick="pick('+i+')">Book</button></div></div>'; }).join('')
    + '<div class="k">'+(S.lang==='en'?'When?':'Kab?')+'</div>'
    + '<div class="daychips">'+DAYS.map(function(d,i){ return '<button class="'+(S.day===i?'on':'')+'" onclick="setDay('+i+')">'+d+'</button>'; }).join('')+'</div>'
    + '<div class="row" style="gap:8px">'+SLOTS.map(function(s,i){ return '<button class="slot '+(S.slot===i?'on':'')+'" onclick="slot('+i+')">'+s+'</button>'; }).join('')+'</div>'
    + (S.bookings.length? '<div class="k">'+(S.lang==='en'?'Your bookings':'Aapki bookings')+'</div><div class="card">'
        + S.bookings.slice().reverse().map(function(b){ return '<div class="bk"><div style="flex:1"><b>'+b.helper+'</b><small>'+b.day+' · '+b.slot+'</small></div><div style="color:var(--green);font-weight:800;font-size:11px">Confirmed</div></div>'; }).join('')
        + '</div>' : '')
    + '<button class="btn ghost" style="margin-top:12px" onclick="go(\'family\')">See the family update</button></div>';
}

function family(){
  var d=S.tasks.filter(function(x){return x.done}).length;
  return head()+'<div class="pad"><div class="k">'+(S.lang==='en'?'Family update':'Parivaar ko update')+'</div>'
    + '<div class="stat"><div><b>'+d+'/'+S.tasks.length+'</b><small>care steps</small></div>'
    + '<div><b>'+S.bookings.length+'</b><small>helper visits</small></div><div><b>3</b><small>days steady</small></div></div>'
    + '<div class="card"><div style="font-size:13px;font-weight:800;margin-bottom:6px">'+(S.lang==='en'?'Today at home':'Aaj ghar par')+'</div>'
    + '<div style="font-size:12.5px;line-height:1.6;color:var(--ink2)">'+esc(S.elder)+' took her medicine on time and ate breakfast. '
    + (S.bookings.length? S.bookings[S.bookings.length-1].helper+' visited in the afternoon.' : 'She is resting now.')+' Mood was calm. No falls.</div></div>'
    + '<div class="k">This week</div>' + chartSVG()
    + '<button class="btn" onclick="sendUpdate()">'+(S.sentAt?('✓ '+(S.lang==='en'?'Sent at ':'Bheja ')+S.sentAt):(S.lang==='en'?'Send this note to Rohan':'Ye note Rohan ko bhejein'))+'</button>'
    + '<button class="btn ghost" style="margin-top:10px" onclick="shareNote()">Share this note</button>'
    + '<div class="k">'+(S.lang==='en'?'Family members':'Parivaar ke sadasya')+'</div>'
    + '<div class="card"><div class="listrow"><div class="ic">R</div><div><div class="t">Rohan</div><div class="s">Son · Pune</div></div><div style="margin-left:auto;font-size:11px;color:var(--green);font-weight:800">Active</div></div>'
    + '<div class="listrow"><div class="ic">P</div><div><div class="t">Priya</div><div class="s">Daughter · Delhi</div></div><div style="margin-left:auto;font-size:11px;color:var(--green);font-weight:800">Active</div></div></div>'
    + '</div>';
}

function safety(){
  var f = S.fall, so = S.sos;
  return head()+'<div class="pad">'
    + '<div class="k">'+(S.lang==='en'?'Elder safety':'Buzurg ki suraksha')+'</div>'
    + (f ? '<div class="card" style="background:#B23A48;border-color:#8E2C38;color:#fff">'
        + '<div style="font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#FFD9D3">Alert</div>'
        + '<div style="font-size:16px;font-weight:800;margin-top:4px">Possible fall detected</div>'
        + '<div style="font-size:11.5px;color:#FFE3DE;margin-top:3px">'+f.at+' · '+f.why+'</div>'
        + '<div class="row" style="gap:8px;margin-top:12px">'
        + '<button class="btn" style="flex:1;background:#fff;color:#B23A48" onclick="imOkay()">I am okay</button>'
        + '<a class="btn ghost" style="flex:1;text-align:center;background:transparent;color:#fff;border-color:rgba(255,255,255,.5)" href="tel:+910000000000">Call Rohan</a>'
        + '</div></div>'
      : '<div class="card"><div class="row"><div style="flex:1"><div class="t">Fall detection</div><div class="s">'+(fallArmed?'Watching the accelerometer':'Off — tap to start')+'</div></div>'
        + '<button class="book" onclick="startFall()">'+(fallArmed?'Stop':'Start')+'</button></div>'
        + '<div style="font-size:11.5px;color:var(--ink2);margin-top:10px;line-height:1.5">Uses the phone\'s motion sensor. A hard impact triggers an alert to the family.</div>'
        + '<button class="btn ghost" style="margin-top:10px;padding:10px;font-size:12.5px" onclick="simulateFall()">Simulate a fall (for demo)</button></div>')
    + '<div class="k">SOS · live location</div>'
    + '<div class="card"><div style="font-size:12.5px;color:var(--ink2);line-height:1.55">One tap sends the current location to Rohan and Priya.</div>'
    + '<button class="btn" style="margin-top:10px" onclick="sos()">Send my location</button>'
    + (so ? '<div class="ok">Location shared at '+so.at+'<br><b>'+so.lat+', '+so.lon+'</b><br><a href="https://www.google.com/maps?q='+so.lat+','+so.lon+'" target="_blank" style="color:var(--coral2);font-weight:800">Open in Maps →</a></div>' : '')
    + '</div>'
    + '<div class="k">'+(S.lang==='en'?'What runs on the device':'Device par kya chalta hai')+'</div>'
    + '<div class="card"><div class="listrow"><div class="ic">◉</div><div><div class="t">Accelerometer</div><div class="s">Fall detection, no server</div></div></div>'
    + '<div class="listrow"><div class="ic">⌖</div><div><div class="t">Geolocation</div><div class="s">SOS location, shared by you</div></div></div>'
    + '<div class="listrow"><div class="ic">▣</div><div><div class="t">On-device</div><div class="s">Nothing leaves the phone</div></div></div></div>'
    + '</div>';
}

function profile(){
  return '<div class="hd"><button class="chip" onclick="go(\'home\')">‹ Back</button></div><div class="pad">'
    + '<div class="card" style="text-align:center;padding:22px"><div class="avatar" style="margin:0 auto 10px;width:64px;height:64px;font-size:22px">'+esc((S.name||'A').charAt(0).toUpperCase())+'</div>'
    + '<div style="font-size:17px;font-weight:800">'+esc(S.name||'Asha')+'</div><div class="s">Primary caregiver · Jaipur</div></div>'
    + '<div class="k">Edit</div>'
    + '<div class="lbl">Your name</div><input class="field" id="pn" value="'+esc(S.name)+'">'
    + '<div class="lbl">Elder\'s name</div><input class="field" id="pe" value="'+esc(S.elder)+'">'
    + '<button class="btn ghost" onclick="saveProfile()">Save</button>'
    + '<div class="k">Language</div>'
    + '<div class="switch"><button class="'+(S.lang==='en'?'on':'')+'" onclick="setLang(\'en\')">English</button>'
    + '<button class="'+(S.lang==='hi'?'on':'')+'" onclick="setLang(\'hi\')">हिंदी</button></div>'
    + '<div class="k">Plan</div><div class="card"><div class="listrow"><div class="ic">₹</div><div><div class="t">Sahayak Plus</div><div class="s">₹299 / month · renews 4 Nov</div></div></div></div>'
    + '<button class="btn ghost" onclick="resetAll()">Reset demo data</button>'
    + '<div style="margin-top:18px;text-align:center;font-size:10px;color:var(--ink3);line-height:1.6">Sahayak · built by Gaurav Kumar<br>gauravfriends01@gmail.com<br>Team Aasra · MNIT Jaipur · © 2026</div>'
    + '</div>';
}

/* ---------- actions ---------- */
function render(){
  var v=el('view');
  if(!S.name){ onboarding(); return; }
  el('nav').style.display='flex';
  var map={home:home,plan:plan,circle:circle,help:help,family:family,safety:safety,profile:profile};
  v.innerHTML=(map[S.tab]||home)();
  el('nav').innerHTML=navHTML();
}
function startApp(){
  var a=(el('f1').value||'').trim(), b=(el('f2').value||'').trim();
  if(!a){ toast('Please enter your name'); return; }
  S.name=a; if(b) S.elder=b; S.tab='home'; save(); render(); toast('Welcome, '+a);
}
function go(k){ S.tab=k; save(); render(); }
function toggle(i){ S.tasks[i].done=!S.tasks[i].done; save(); render(); if(S.tasks[i].done) toast('Marked done'); }
function del(i){ S.tasks.splice(i,1); save(); render(); toast('Removed'); }
function addTask(){
  var i=el('nt'), v=(i.value||'').trim(); if(!v) return;
  S.tasks.push({id:'t'+Date.now(), t:{en:v,hi:v}, d:{en:'Added by you',hi:'Aapne joda'}, done:false});
  save(); render(); toast('Care step added');
}
function setLang(l){ S.lang=l; save(); render(); }
function setDay(i){ S.day=i; save(); render(); }
function slot(i){ S.slot=i; save(); render(); }
function pick(i){
  S.bookings.push({helper:HELPER_NAMES[i], day:DAYS[S.day], slot:SLOTS[S.slot], at:Date.now()});
  save(); render(); toast(HELPER_NAMES[i]+' booked · '+DAYS[S.day]+' '+SLOTS[S.slot]);
}
function like(i){ S.liked[i]=true; save(); render(); }
function send(){
  var inp=el('q'), txt=(inp.value||'').trim(); if(!txt) return;
  S.posts.push({n:"You · "+(S.name||'Asha'), m:{en:txt,hi:txt}, likes:0, ago:"now"});
  save(); render(); toast('Posted to the circle');
  setTimeout(function(){
    S.posts.push({n:"Sunita · Jaipur", m:{en:"Same here — a warm drink before the meal helped us.",hi:"Yahan bhi — khane se pehle garam doodh se fayda hua."}, likes:2, ago:"now"});
    save(); if(S.tab==='circle') render();
  }, 900);
}
function sendUpdate(){
  var d=new Date();
  S.sentAt = d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
  save(); render(); toast('Note sent to Rohan');
}
function saveProfile(){
  var a=(el('pn').value||'').trim(), b=(el('pe').value||'').trim();
  if(a) S.name=a; if(b) S.elder=b; save(); render(); toast('Saved');
}
function resetAll(){
  S=JSON.parse(JSON.stringify(DEFAULT)); save(); S.tab='home'; render(); toast('Demo data reset');
}

function addTaskText(v){
  v = (v||'').trim(); if(!v) return;
  S.tasks.push({id:'t'+Date.now(), t:{en:v,hi:v}, d:{en:'Added by voice',hi:'Awaaz se joda'}, done:false});
  save(); render(); toast('Added: ' + v);
}
function mic(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('Voice input is not supported on this browser'); return; }
  var r = new SR();
  r.lang = (S.lang === 'hi') ? 'hi-IN' : 'en-IN';
  r.interimResults = false; r.maxAlternatives = 1;
  toast('Listening…');
  r.onresult = function(e){ addTaskText(e.results[0][0].transcript); };
  r.onerror = function(){ toast('Could not hear that — try again'); };
  try { r.start(); } catch (err) { toast('Microphone busy'); }
}
function speak(){
  if(!('speechSynthesis' in window)){ toast('Voice is not supported here'); return; }
  var parts = S.tasks.map(function(x,i){ return (i+1) + '. ' + x.t[S.lang] + ', ' + x.d[S.lang]; });
  var u = new SpeechSynthesisUtterance((S.lang==='hi'?'Aaj ki dekhbhal. ':'Today\'s care. ') + parts.join('. '));
  u.lang = (S.lang === 'hi') ? 'hi-IN' : 'en-IN'; u.rate = 0.95;
  try { speechSynthesis.cancel(); speechSynthesis.speak(u); toast('Reading today\'s care'); }
  catch(e){ toast('Voice not available'); }
}
function remind(){
  if(!('Notification' in window)){ toast('Notifications are not supported here'); return; }
  Notification.requestPermission().then(function(p){
    if(p === 'granted'){
      toast('Reminder set — in 5 seconds');
      setTimeout(function(){
        try { new Notification('Sahayak', {body: S.lang==='hi' ? 'Subah ki dawa ka samay ho gaya' : 'Time for the morning medicine', icon:'icon-192.png'}); } catch(e){}
      }, 5000);
    } else { toast('Notifications are blocked'); }
  });
}
function shareNote(){
  var txt = 'Sahayak · ' + S.elder + ' — today: ' + S.tasks.filter(function(x){return x.done}).length + '/' + S.tasks.length + ' care steps done.';
  if(navigator.share){ navigator.share({title:'Sahayak update', text:txt}).catch(function(){}); }
  else if(navigator.clipboard){ navigator.clipboard.writeText(txt).then(function(){ toast('Note copied'); }).catch(function(){ toast('Could not copy'); }); }
  else { toast('Sharing not supported'); }
}
function chartSVG(){
  var vals = [60,75,50,90,80,67,100];
  var w = 34, gap = 10, h = 90;
  var bars = vals.map(function(v,i){
    var bh = Math.round(v/100*h);
    var x = i*(w+gap);
    var col = (i===vals.length-1) ? '#E2603C' : '#B39AC7';
    return '<rect x="'+x+'" y="'+(h-bh)+'" width="'+w+'" height="'+bh+'" rx="5" fill="'+col+'"></rect>'
         + '<text x="'+(x+w/2)+'" y="'+(h+16)+'" font-size="9" fill="#9A8CA4" text-anchor="middle">'+['M','T','W','T','F','S','S'][i]+'</text>';
  }).join('');
  return '<div class="card" style="padding:14px 12px"><svg width="100%" viewBox="0 0 '+(7*(w+gap)-gap)+' 118" preserveAspectRatio="xMidYMid meet">'+bars+'</svg>'
       + '<div style="font-size:11px;color:var(--ink2);margin-top:6px">Care steps completed · last 7 days</div></div>';
}

var fallArmed = false;
function nowTime(){ var d=new Date(); return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'); }
function onMotion(e){
  var a = e.accelerationIncludingGravity; if(!a) return;
  var mag = Math.sqrt(a.x*a.x + a.y*a.y + a.z*a.z);
  if(mag > 28 && !S.fall){ triggerFall('Accelerometer spike ('+Math.round(mag)+')'); }
}
function startFall(){
  if(fallArmed){ fallArmed=false; window.removeEventListener('devicemotion', onMotion); toast('Fall detection off'); render(); return; }
  if(typeof DeviceMotionEvent === 'undefined'){ toast('No motion sensor — use Simulate'); return; }
  var arm = function(){ fallArmed=true; window.addEventListener('devicemotion', onMotion); toast('Fall detection on'); render(); };
  if(typeof DeviceMotionEvent.requestPermission === 'function'){
    DeviceMotionEvent.requestPermission().then(function(p){ if(p==='granted') arm(); else toast('Motion permission denied'); }).catch(function(){ toast('Motion permission denied'); });
  } else { arm(); }
}
function triggerFall(why){
  S.fall = {at: nowTime(), why: why}; save(); render(); toast('Possible fall detected');
}
function simulateFall(){ triggerFall('Simulated impact'); }
function imOkay(){ S.fall = null; save(); render(); toast('Marked safe'); }
function sos(){
  if(!navigator.geolocation){ toast('Location is not supported here'); return; }
  toast('Getting your location…');
  navigator.geolocation.getCurrentPosition(function(p){
    S.sos = {lat: p.coords.latitude.toFixed(5), lon: p.coords.longitude.toFixed(5), at: nowTime()};
    save(); render(); toast('Location sent to Rohan');
  }, function(){ toast('Location blocked — allow it and retry'); }, {enableHighAccuracy:true, timeout:8000});
}

setInterval(function(){ var d=new Date(); el('clock').textContent=d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'); },1000);

load();
S.tab = S.tab || 'home';
if(location.hash==='#home'){ S.tab='home'; }
if(location.hash==='#help'){ S.tab='help'; }
if(location.hash==='#circle'){ S.tab='circle'; }
if(location.hash==='#family'){ S.tab='family'; }
if(location.hash==='#plan'){ S.tab='plan'; }
if(location.hash==='#profile'){ S.tab='profile'; }
if(location.hash==='#safety'){ S.tab='safety'; }
render();
</script>
</body>
</html>
